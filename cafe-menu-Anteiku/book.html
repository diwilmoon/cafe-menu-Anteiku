
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Table</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
}

.booking {
    width: 100%;
    min-height: 360px;
    padding: 65px 9%;
    background:
        radial-gradient(ellipse at 5% 5%, #ffe1df 0%, transparent 20%),
        radial-gradient(ellipse at 100% 100%, #ffe1df 0%, transparent 22%),
        #fffdf9;
    position: relative;
    overflow: hidden;
    border: 2px solid #f6c4c4;
}

/* Декоративные звёздочки */
.booking::before {
    content: "✦";
    position: absolute;
    top: 5px;
    left: 15px;
    font-size: 75px;
    color: #e98b8b;
    opacity: 0.65;
}

.booking::after {
    content: "✦";
    position: absolute;
    bottom: 15px;
    right: 30px;
    font-size: 85px;
    color: #e98b8b;
    opacity: 0.65;
}

.content {
    position: relative;
    z-index: 1;
    max-width: 500px;
}

.subtitle {
    color: #cf6878;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 7px;
}

h1 {
    color: #c95768;
    font-family: Georgia, serif;
    font-size: 29px;
    margin-bottom: 25px;
}

.description {
    color: #704b4d;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 28px;
}

.booking-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 28px;
}

.booking-fields input {
    background: transparent;
    border: 1px solid #e58b96;
    color: #704b4d;
    padding: 10px;
    font-size: 12px;
    outline: none;
    border-radius: 3px;
    min-width: 115px;
}

.booking-fields input:focus {
    border-color: #c95768;
}

.booking-fields input[type="date"] {
    width: 145px;
}

.booking-fields input[type="time"] {
    width: 105px;
}

.booking-fields input[type="number"] {
    width: 130px;
}

.book-btn {
    background: #cf687c;
    color: white;
    border: none;
    padding: 11px 32px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    transition: 0.3s;
}

.book-btn:hover {
    background: #b94f65;
}

@media (max-width: 600px) {
    .booking {
        padding: 55px 7%;
    }

    .booking-fields {
        flex-direction: column;
        align-items: flex-start;
    }

    .booking-fields input {
        width: 100% !important;
    }
}
</style>
</head>

<body>

<section class="booking">

    <div class="content">

        <p class="subtitle">Reservation</p>

        <h1>Book Your Table</h1>

        <p class="description">
            Join us on an exceptional dining experience.<br>
            Reserve your table today.
        </p>

        <div class="booking-fields">

            <!-- Выбор даты -->
            <input
                type="date"
                id="date"
                value="2026-11-03"
            >

            <!-- Выбор времени -->
            <input
                type="time"
                id="time"
                value="13:50"
            >

            <!-- Количество человек -->
            <input
                type="number"
                id="people"
                min="1"
                max="50"
                value="12"
                placeholder="Persons"
            >

        </div>

        <button class="book-btn" onclick="bookTable()">
            BOOK NOW
        </button>

    </div>

</section>

<script>
function bookTable() {

    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const people = document.getElementById("people").value;

    if (!date || !time || !people || people < 1) {
        alert("Please fill in all fields!");
        return;
    }

    alert(
        "Your reservation details:\n" +
        "Date: " + date + "\n" +
        "Time: " + time + "\n" +
        "Persons: " + people
    );
}
</script>

</body>
</html>
