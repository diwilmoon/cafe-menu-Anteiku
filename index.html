<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteiku — kawaii cafe</title>

    <!-- Шрифты: без этой строки браузер не знает Comfortaa и Architects Daughter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

    <!-- ШАПКА: слева кот + название, справа меню -->
    <header class="site-header">
        <div class="header-inner">

            <a href="index.html" class="brand">
                <img src="image/cat.png" class="logo" alt="Anteiku logo">
                <div class="brand-text">
                    <span class="brand-name">Anteiku</span>
                    <span class="tagline">kawaii food, happy moments</span>
                </div>
            </a>

            <nav class="main-nav">
                <a href="index.html" class="active" aria-current="page">Home</a>
                <a href="about.html">About</a>
                <a href="menu.html">Menu</a>
                <a href="delivery.html">Delivery</a>
                <a href="contacts.html">Contacts</a>
                <a href="booking.html" class="reserve-btn">Reserve a table</a>
            </nav>

        </div>
    </header>

    <!-- ГЛАВНЫЙ БЛОК: текст слева, десерт справа -->
    <main>
        <div class="center-container">

            <div class="text-container">
                <h1 id="introduction">Welcome to kawaii food and sweet moments~</h1>
                <p id="text-introduction">A cosy cafe serving delicious Asian cuisine and desserts. Enjoy our signature curry, fluffy pancakes, and specialty drinks!</p>

                <div class="buttons">
                    <a href="menu.html" class="view">View the menu →</a>
                    <a href="delivery.html" class="delivery">Order delivery →</a>
                </div>
            </div>

            <div class="hero-image">
                <img src="image/ice-cream.png" id="ice-cream" alt="Strawberry parfait in a crystal glass">
                <img src="image/star.png" class="star1" alt="" aria-hidden="true">
            </div>

        </div>
    </main>

</body>
</html>
